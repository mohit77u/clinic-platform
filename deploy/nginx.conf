# Example nginx for one VPS. Replace example.com. Get certificates with: certbot --nginx -d example.com -d api.example.com
server {
  listen 80; server_name example.com api.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2; server_name example.com;
  # ssl_certificate / ssl_certificate_key managed by certbot
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2; server_name api.example.com;
  client_max_body_size 10m;          # image / document uploads are capped at 8 MB by the API
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # backend runs with TRUST_PROXY=true
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /uploads/ {               # resized WebP images; cache hard, filenames are random UUIDs
    proxy_pass http://127.0.0.1:3001;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
